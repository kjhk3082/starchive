[package]
name = "starchive"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Track your GitHub stars, archive them as AI-readable markdown, and discover trending repos — a self-hosted Rust dashboard."
license = "MIT"
repository = "https://github.com/kjhk3082/starchive"
readme = "README.md"
keywords = ["github", "stars", "markdown", "dashboard", "cli"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
comrak = { version = "0.52.0", default-features = false }
dotenvy = "0.15.7"
maud = "0.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
